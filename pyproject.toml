[project]
name = "rag-service-assistant"
version = "0.1.0"
description = "Retrieval-augmented Q&A assistant that answers only from a company's own documents, with verified citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
